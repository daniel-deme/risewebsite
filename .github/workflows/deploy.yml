name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "ERROR: dist/index.html missing" && exit 1)
          ! grep -q "main.tsx" dist/index.html || (echo "ERROR: dist/index.html must not reference main.tsx (deploy built output, not source)" && exit 1)
          echo "Build OK: dist ready for deploy"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Set this to the actual web root on your FTP host.
          # Example: /public_html or /subdomains/<subdomain>/public_html
          server-dir: /
          local-dir: ./dist/
          # Wipes target directory before upload so old artifacts do not remain on server.
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/lost+found/**
